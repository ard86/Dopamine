name: Dopamine
options:
  bundleIdPrefix: com.annierdudu.dopamine
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  Dopamine:
    type: application
    platform: iOS
    sources:
      - path: Dopamine
        type: group
      - path: Shared
        type: group
    info:
      path: Dopamine/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.annierdudu.dopamine
            CFBundleURLSchemes:
              - dopamine
        LSApplicationQueriesSchemes:
          - noom
          - headspace
          - notion
          - spotify
          - x-apple-health
          - fitnessapp
        UILaunchScreen: {}
    entitlements:
      path: Dopamine/Dopamine.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.annierdudu.dopamine.habits
    settings:
      base:
        INFOPLIST_FILE: Dopamine/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.annierdudu.dopamine
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: DopamineWidgetExtension
        embed: true

  DopamineWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DopamineWidget
        type: group
      - path: Shared
        type: group
    info:
      path: DopamineWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DopamineWidget/DopamineWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.annierdudu.dopamine.habits
    settings:
      base:
        INFOPLIST_FILE: DopamineWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.annierdudu.dopamine.widget
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
